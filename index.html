<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intellectual OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        <!-- Wallpaper -->
        <div id="wallpaper"></div>
        
        <!-- Desktop Icons -->
        <div id="icons"></div>
        
        <!-- System Clock/Date Widget -->
        <div id="clock-widget">
            <div id="time"></div>
            <div id="date"></div>
        </div>
        
        <!-- Taskbar (optional) -->
        <div id="taskbar">
            <button id="start-btn">Start</button>
            <div id="tray"></div>
        </div>
        
        <!-- My Library Folder (on desktop) -->
        <div id="library-folder" class="desktop-icon">
            <div class="icon">📁</div>
            <div class="label">My Library</div>
        </div>
    </div>

    <!-- Game Hub (Modal/Page) -->
    <div id="game-hub" class="modal">
        <div class="modal-content">
            <h2>Game Hub</h2>
            <button id="close-game-hub" class="close-btn">×</button>
            
            <!-- For You Slider -->
            <section id="for-you-section">
                <h3>Recommended for You</h3>
                <div class="slider-container">
                    <div id="slider-track"></div>
                </div>
            </section>
            
            <!-- All Games -->
            <section id="all-games-section">
                <h3>All Games</h3>
                <div id="games-grid"></div>
            </section>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <span id="close-preview" class="close-btn">×</span>
            <div id="preview-content"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Settings</h2>
            <button id="close-settings" class="close-btn">×</button>
            <div class="settings-item">
                <label for="wallpaper-url">Wallpaper URL:</label>
                <input type="text" id="wallpaper-url" placeholder="Enter image URL">
                <button id="apply-wallpaper">Apply</button>
            </div>
        </div>
    </div>

    -- Notification Container -->
    <div id="notification-container"></div>

    <script src="script.js"></script>
</body>
</html>
